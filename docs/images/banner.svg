<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SynapseGrid: an unsafe dispatch plan is rejected by an independent verifier, then a safe plan is certified">
  <style>
    .t { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 4 10; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .a1 { animation: a1 8s ease-in-out infinite; }
    @keyframes a1 { 0%, 12% { opacity: .25; } 18%, 46% { opacity: 1; } 54%, 100% { opacity: .25; } }
    .rej { animation: rej 8s ease-in-out infinite; }
    @keyframes rej { 0%, 24% { opacity: 0; } 28%, 50% { opacity: 1; } 56%, 100% { opacity: 0; } }
    .loop { animation: loop 8s ease-in-out infinite; }
    @keyframes loop { 0%, 44% { opacity: 0; } 48%, 60% { opacity: 1; } 66%, 100% { opacity: 0; } }
    .a2 { animation: a2 8s ease-in-out infinite; }
    @keyframes a2 { 0%, 52% { opacity: .25; } 58%, 96% { opacity: 1; } 100% { opacity: .25; } }
    .ok { animation: ok 8s ease-in-out infinite; }
    @keyframes ok { 0%, 64% { opacity: 0; } 70%, 96% { opacity: 1; } 100% { opacity: 0; } }
    .sun { animation: sun 8s ease-in-out infinite; transform-origin: 712px 88px; }
    @keyframes sun { 0%, 8% { opacity: 1; } 14%, 100% { opacity: .35; } }
    .cloud { animation: cloud 8s ease-in-out infinite; }
    @keyframes cloud { 0% { transform: translateX(-70px); opacity: 0; } 10%, 90% { transform: translateX(0); opacity: 1; } 100% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(148,163,184,.07)"/></pattern>
    <radialGradient id="glow1" cx="15%" cy="0%" r="70%"><stop offset="0" stop-color="rgba(45,212,191,.16)"/><stop offset="1" stop-color="rgba(45,212,191,0)"/></radialGradient>
    <radialGradient id="glow2" cx="95%" cy="10%" r="60%"><stop offset="0" stop-color="rgba(167,139,250,.14)"/><stop offset="1" stop-color="rgba(167,139,250,0)"/></radialGradient>
    <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#05070b"/>
  <rect width="1200" height="340" rx="18" fill="url(#g)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow2)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="rgba(148,163,184,.18)"/>

  <!-- Title block -->
  <g transform="translate(48,64)">
    <rect width="44" height="44" rx="11" fill="#0b0f18" stroke="rgba(148,163,184,.25)"/>
    <path d="M11 32 L22 12 L33 32 Z" fill="none" stroke="url(#lg)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="22" cy="25" r="3.4" fill="#e2e8f0"/>
    <text x="60" y="34" class="t" font-size="34" font-weight="700" fill="#f1f5f9">SynapseGrid</text>
  </g>
  <text x="48" y="150" class="t" font-size="21" fill="#cbd5e1">Verified renewable-energy dispatch</text>
  <text x="48" y="178" class="t" font-size="21" fill="#cbd5e1">for critical community loads</text>
  <text x="48" y="222" class="m" font-size="13" fill="#94a3b8">Gemma reads the context · OR-Tools plans ·</text>
  <text x="48" y="242" class="m" font-size="13" fill="#94a3b8">an independent verifier decides</text>
  <g transform="translate(48,272)">
    <rect width="250" height="28" rx="14" fill="rgba(45,212,191,.10)" stroke="rgba(45,212,191,.45)"/>
    <text x="125" y="19" text-anchor="middle" class="m" font-size="12" fill="#5eead4">GOOGLE CLOUD AI BUILDER CUP</text>
    <rect x="262" width="148" height="28" rx="14" fill="rgba(251,191,36,.10)" stroke="rgba(251,191,36,.45)"/>
    <text x="336" y="19" text-anchor="middle" class="m" font-size="12" fill="#fcd34d">SUSTAINABILITY</text>
  </g>

  <!-- Animated story -->
  <g class="sun"><circle cx="712" cy="88" r="16" fill="none" stroke="#fcd34d" stroke-width="3"/>
    <g stroke="#fcd34d" stroke-width="3" stroke-linecap="round"><path d="M712 60v-8M712 124v-8M684 88h-8M748 88h-8M692 68l-6-6M738 114l-6-6M692 108l-6 6M738 62l-6 6"/></g></g>
  <g class="cloud"><path d="M690 104c-12 0-20-9-18-19 2-9 11-14 20-12 4-10 15-15 25-11 8 3 12 10 12 17 9 0 15 7 14 15-1 6-6 10-13 10z" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/></g>
  <text x="712" y="150" text-anchor="middle" class="m" font-size="12" fill="#fcd34d">solar −75 %</text>

  <!-- connectors -->
  <path d="M712 160 V188" stroke="rgba(148,163,184,.4)" stroke-width="2" class="flow" fill="none"/>
  <path d="M790 220 H880" stroke="rgba(148,163,184,.45)" stroke-width="2" class="flow" fill="none"/>
  <path d="M790 284 H880" stroke="rgba(148,163,184,.45)" stroke-width="2" class="flow" fill="none"/>

  <!-- A1 proposal -->
  <g class="a1"><rect x="634" y="192" width="156" height="56" rx="10" fill="rgba(244,63,94,.10)" stroke="#f43f5e"/>
    <text x="712" y="215" text-anchor="middle" class="m" font-size="12" fill="#fda4af">A1 · proposal</text>
    <text x="712" y="235" text-anchor="middle" class="t" font-size="13" fill="#fecdd3">diesel 2,699 kW + charge</text></g>

  <!-- A2 proposal -->
  <g class="a2"><rect x="634" y="258" width="156" height="56" rx="10" fill="rgba(45,212,191,.10)" stroke="#2dd4bf"/>
    <text x="712" y="281" text-anchor="middle" class="m" font-size="12" fill="#5eead4">A2 · OR-Tools re-plan</text>
    <text x="712" y="301" text-anchor="middle" class="t" font-size="13" fill="#ccfbf1">batteries + 203 kW diesel</text></g>

  <!-- verifier -->
  <rect x="880" y="192" width="132" height="122" rx="12" fill="#0b0f18" stroke="rgba(226,232,240,.35)"/>
  <text x="946" y="222" text-anchor="middle" class="m" font-size="12" fill="#e2e8f0">independent</text>
  <text x="946" y="240" text-anchor="middle" class="m" font-size="12" fill="#e2e8f0">verifier</text>
  <text x="946" y="268" text-anchor="middle" class="t" font-size="11" fill="#94a3b8">recomputes</text>
  <text x="946" y="284" text-anchor="middle" class="t" font-size="11" fill="#94a3b8">power flow itself</text>

  <!-- verdicts -->
  <g class="rej"><rect x="1030" y="192" width="140" height="56" rx="10" fill="rgba(244,63,94,.16)" stroke="#f43f5e"/>
    <text x="1100" y="214" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#fb7185">✗ REJECTED</text>
    <text x="1100" y="234" text-anchor="middle" class="t" font-size="11.5" fill="#fecdd3">L15: 1,278 / 800 kW</text></g>
  <g class="loop"><path d="M1012 252 C 1000 252, 820 252, 800 270" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
    <text x="905" y="250" text-anchor="middle" class="m" font-size="11" fill="#fcd34d">counter-example → planner</text></g>
  <g class="ok"><rect x="1030" y="258" width="140" height="56" rx="10" fill="rgba(45,212,191,.16)" stroke="#2dd4bf"/>
    <text x="1100" y="280" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#5eead4">✓ CERTIFIED</text>
    <text x="1100" y="300" text-anchor="middle" class="t" font-size="11.5" fill="#ccfbf1">27 / 27 checks</text></g>

  <text x="1170" y="40" text-anchor="end" class="m" font-size="11" fill="rgba(148,163,184,.6)">simulated data · not real-grid control</text>
</svg>
