name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Randomized fault evaluation
        run: python evaluation.py --n 300 --seed 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Cloud Run image
        run: docker build -t synapsegrid app
      - name: Smoke-test the container
        run: |
          docker run -d -p 8080:8080 --name sg synapsegrid
          for i in $(seq 1 30); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs sg; exit 1
